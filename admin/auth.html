<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velora Operations & Admin Portal — Sign in or register as an authorized store administrator to manage orders, catalog inventory, customers, and payments.">
  <title>Admin & Operations Portal — Velora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/kinder-auth.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>

<body>
  <div class="admin-auth-screen kinder-auth-theme" id="adminAuthScreen" style="position: relative; min-height: 100vh;">
    <div class="kinder-auth-canvas">
      
      <!-- Background Canvas: High Fashion Editorial Background Layer -->
      <div class="kinder-bg-decorations" aria-hidden="true">
        <div class="kinder-fashion-layer"></div>
      </div>

      <!-- Main Workspace: Elegant Frosted Card on Right -->
      <main class="kinder-main-container">
        <div class="kinder-form-card" id="kinderFormCard">
          
      
          <!-- Mode Switcher Tabs: Sign In / Sign Up -->
          <div class="kinder-mode-tabs" role="tablist">
            <button type="button" class="kinder-tab-btn active" id="kinderTabLogin" onclick="window.setKinderAuthMode('login', true)">Sign In</button>
            <button type="button" class="kinder-tab-btn" id="kinderTabSignUp" onclick="window.setKinderAuthMode('signup', true)">Sign Up</button>
          </div>

          <h1 class="kinder-form-title" id="kinderAuthTitle">Welcome Back</h1>
          <p class="kinder-form-subtitle" id="kinderAuthSubtitle">Sign in with your authorized studio email to manage operations.</p>

          <!-- Inline Feedback Alert -->
          <div class="kinder-auth-alert" id="kinderAuthAlert" style="display: none;" role="alert"></div>

          <form class="kinder-form" id="kinderAuthForm" onsubmit="window.handleKinderAuthSubmit(event); return false;" novalidate>
            <!-- Full Name (Hidden in Login mode, active in Sign Up mode) -->
            <div class="kinder-field-group" id="kinderNameGroup" style="display: none;">
              <label class="kinder-field-label" for="kinderFullName">FULL NAME</label>
              <input type="text" id="kinderFullName" class="kinder-underline-input" placeholder="e.g. Samira Hadid" autocomplete="name">
            </div>

            <!-- Email Address -->
            <div class="kinder-field-group">
              <label class="kinder-field-label" for="kinderEmail">EMAIL ADDRESS</label>
              <input type="email" id="kinderEmail" class="kinder-underline-input" placeholder="name@velora.co.za" value="kris.evans@velora.co.za" autocomplete="email" required>
            </div>

            <!-- Password with Eye Toggle -->
            <div class="kinder-field-group">
              <label class="kinder-field-label" for="kinderPassword">PASSWORD</label>
              <div class="kinder-password-box">
                <input type="password" id="kinderPassword" class="kinder-underline-input" placeholder="••••••••••••" value="password123" autocomplete="current-password" required>
                <button type="button" class="kinder-eye-toggle" id="kinderEyeToggle" aria-label="Toggle password visibility">
                  <svg id="kinderEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Confirm Password (Sign Up Mode Only) -->
            <div class="kinder-field-group" id="kinderConfirmPasswordGroup" style="display: none;">
              <label class="kinder-field-label" for="kinderConfirmPassword">CONFIRM PASSWORD</label>
              <input type="password" id="kinderConfirmPassword" class="kinder-underline-input" placeholder="••••••••••••" autocomplete="new-password">
            </div>

            <!-- Agreement / Remember Checkbox -->
            <label class="kinder-checkbox-row">
              <input type="checkbox" id="kinderTermsCheckbox" class="kinder-checkbox-input" checked>
              <span class="kinder-checkbox-label-text" id="kinderTermsText">Remember me on this workstation</span>
            </label>

            <!-- Buttons: Primary Action + Mode Switcher Link -->
            <div class="kinder-actions-stack">
              <button type="submit" class="kinder-btn kinder-btn-solid" id="kinderPrimaryBtn" onclick="window.handleKinderAuthSubmit(event)">Sign In</button>
              <button type="button" class="kinder-btn-switch" id="kinderSecondaryBtn" onclick="window.toggleKinderAuthMode()">Don't have an account? Sign Up</button>
            </div>
          </form>

          <!-- 1-Click Quick Demo Credentials -->
          <div class="kinder-quick-fill-bar">
            <span class="kinder-quick-fill-title">⚡ 1-Click Fast Access (Select Persona):</span>
            <div class="kinder-quick-chips">
              <button type="button" class="kinder-chip-btn" onclick="window.fillKinderAccount('kris')">Kristina Evans (Director)</button>
              <button type="button" class="kinder-chip-btn" onclick="window.fillKinderAccount('thabo')">Thabo Ndlovu (Logistics)</button>
              <button type="button" class="kinder-chip-btn" onclick="window.fillKinderAccount('lerato')">Lerato Khumalo (Concierge)</button>
            </div>
          </div>

          <div class="kinder-footer-text">
            Velora Central Operations • High Fashion & Luxury Atelier
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    // Overwrite login redirect for standalone page
    const origLogin = window.adminLogin;
    window.adminLogin = function(email, role, name, avatar) {
      origLogin(email, role, name, avatar);
      window.location.href = './index.html';
    };
  </script>
</body>

</html>
