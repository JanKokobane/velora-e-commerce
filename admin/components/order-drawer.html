<div class="drawer-backdrop" id="drawerBackdrop"></div>

<aside class="dashboard-drawer" id="orderDrawer" aria-label="Order Details Drawer">
  <div class="drawer-content-wrapper" id="orderDrawerContent">
    
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 class="drawer-order-id" id="drawerOrderId">Order #000000</h2>
        <div class="drawer-status-line">
          <span class="status-pill status-paid" id="drawerStatusPill">Paid</span>
          <span id="drawerOrderDate">Jan 1, 00:00</span>
        </div>
      </div>
      <button type="button" class="drawer-close-btn" id="closeDrawerBtn" title="Close Panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-customer-card">
      <img class="drawer-customer-avatar" id="drawerCustomerAvatar" src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg?auto=compress&cs=tinysrgb&h=150&w=150" alt="Customer">
      <div class="drawer-customer-name" id="drawerCustomerName">Customer Name</div>
      <div class="drawer-contact-actions">
        <a href="mailto:client@example.com" class="contact-action-btn" id="drawerEmailLink" title="Send Email">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>
        <a href="tel:+27820000000" class="contact-action-btn" id="drawerPhoneLink" title="Call Customer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </a>
        <button type="button" class="contact-action-btn" id="drawerWhatsappBtn" title="Message via WhatsApp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1 3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="drawer-items-section">
      <h3 class="drawer-section-heading">Order items</h3>
      <div class="drawer-items-list" id="drawerItemsList">
        
      </div>

      <div class="drawer-logistics-box">
        <div class="drawer-logistics-title">Velora Logistics Waybill</div>
        <div class="drawer-logistics-trk" id="drawerTrackingNumber">TRK-ZA-000000</div>
      </div>
    </div>

    <div class="drawer-footer">
      <div class="drawer-total-row">
        <span class="drawer-total-label">Total Amount</span>
        <span class="drawer-total-val" id="drawerTotalAmount">R0.00</span>
      </div>
      <div class="drawer-actions-row">
        <button type="button" class="drawer-btn drawer-btn-dark" id="btnTrackOrder">Fulfill / Advance</button>
        <button type="button" class="drawer-btn drawer-btn-outline" id="btnRefundOrder">Cancel & Refund</button>
      </div>
    </div>
  </div>
</aside>
