<div id="ordersMainView" style="display: none;">
  
  <div class="orders-filter-toolbar" id="ordersFilterToolbar">
    <div class="filter-left-group">
      
      <div class="status-tab-pills" id="ordersStatusTabGroup">
        <button type="button" class="status-tab-btn active" data-status="all">All</button>
        <button type="button" class="status-tab-btn" data-status="paid">Paid</button>
        <button type="button" class="status-tab-btn" data-status="transit">In-Transit</button>
        <button type="button" class="status-tab-btn" data-status="delivered">Delivered</button>
        <button type="button" class="status-tab-btn" data-status="cancelled">Cancelled</button>
      </div>

      <div class="quick-search-input">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="orderSearchInput" placeholder="Search order, customer...">
      </div>
    </div>

    <div class="filter-right-group">
      <select class="filter-select" id="sortFilterSelect">
        <option value="date-desc">Sort by Date (Newest)</option>
        <option value="date-asc">Sort by Date (Oldest)</option>
        <option value="total-desc">Sort by Amount (Highest)</option>
        <option value="total-asc">Sort by Amount (Lowest)</option>
      </select>
    </div>
  </div>

  <div class="kpi-grid" id="dashKPISection">
    <div class="kpi-card" id="kpiOrdersRevenue">
      <div class="kpi-header">
        <span class="kpi-title">Total Revenue</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="ordersKpiRevenue">R0.00</div>
      <div class="kpi-trend positive">
        <span>↑ +18.4%</span>
        <span class="kpi-trend-note">vs last month</span>
      </div>
    </div>

    <div class="kpi-card" id="kpiOrdersCount">
      <div class="kpi-header">
        <span class="kpi-title">Total Orders</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="ordersKpiCount">0</div>
      <div class="kpi-trend positive">
        <span>↑ +12 new</span>
        <span class="kpi-trend-note">today</span>
      </div>
    </div>

    <div class="kpi-card" id="kpiOrdersPending">
      <div class="kpi-header">
        <span class="kpi-title">Orders to Fulfill</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="ordersKpiPending">0</div>
      <div class="kpi-trend neutral">
        <span>Dispatch ready</span>
      </div>
    </div>

    <div class="kpi-card" id="kpiOrdersAOV">
      <div class="kpi-header">
        <span class="kpi-title">Avg Order Value</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="ordersKpiAOV">R0.00</div>
      <div class="kpi-trend positive">
        <span>↑ +6.2%</span>
        <span class="kpi-trend-note">conversion</span>
      </div>
    </div>
  </div>

  <div class="orders-table-card">
    <div class="table-responsive">
      <table class="dash-table">
        <thead>
          <tr>
            <th class="select-col">
              <input type="checkbox" class="dash-checkbox" id="selectAllOrders" title="Select All">
            </th>
            <th>Order</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Total</th>
            <th>Date</th>
            <th style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          
        </tbody>
      </table>
    </div>
  </div>
</div>
