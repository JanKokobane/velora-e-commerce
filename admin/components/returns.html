<div id="returnsMainView" style="display: none;">
  <div class="kpi-grid" id="returnsKPISection">
    <div class="kpi-card" id="kpiReturnsPending">
      <div class="kpi-header">
        <span class="kpi-title">Pending Authorizations</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="returnsKpiPendingCount">0</div>
      <div class="kpi-trend neutral">
        <span>Awaiting studio check</span>
      </div>
    </div>

    <div class="kpi-card" id="kpiReturnsTotalVal">
      <div class="kpi-header">
        <span class="kpi-title">Potential Refund Value</span>
        <div class="kpi-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </div>
      </div>
      <div class="kpi-value" id="returnsKpiTotalValue">R0.00</div>
      <div class="kpi-trend neutral">
        <span>Customer account credits</span>
      </div>
    </div>
  </div>

  <div class="orders-table-card">
    <div style="padding: 18px 24px; border-bottom: 1px solid var(--dash-border); display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h3 style="margin: 0 0 4px; font-size: 16px; font-weight: 700;">Returns & Refund Management</h3>
        <p style="margin: 0; font-size: 12.5px; color: var(--muted);">Track incoming return parcels, return authorizations, and customer refund statuses.</p>
      </div>
    </div>
    <div class="table-responsive">
      <table class="dash-table">
        <thead>
          <tr>
            <th>Return ID</th>
            <th>Order Ref</th>
            <th>Customer</th>
            <th>Reason</th>
            <th>Refund Amount</th>
            <th>Return Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="returnsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
