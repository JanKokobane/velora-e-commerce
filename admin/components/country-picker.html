<!-- Country & Currency Picker Popover Component (components/country-picker.html) -->
<div class="country-dropdown-popover" id="countryCurrencyDropdown" style="display: none;" role="menu">
  <div class="country-search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="countrySearchInput" placeholder="Search country or currency..." autocomplete="off">
  </div>
  <div class="country-dropdown-list" id="countryDropdownList" role="listbox">
    <!-- Populated via DOM elements in js/currency.js -->
  </div>
  <div class="country-dropdown-footer">
    <div class="country-footer-tip">Real-time forex converted from South African Rands (ZAR).</div>
  </div>
</div>
