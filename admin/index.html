<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velora Store Management Dashboard — Real-time order fulfillment, revenue analytics, customer tracking, and stock inventory.">
  <title>Velora Operations — Store Management Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="./css/country-picker.css">
  <link rel="stylesheet" href="./css/notifications.css">
  <link rel="stylesheet" href="./css/overview.css">
  <link rel="stylesheet" href="./css/orders.css">
  <link rel="stylesheet" href="./css/order-drawer.css">
  <link rel="stylesheet" href="./css/returns.css">
  <link rel="stylesheet" href="./css/inventory.css">
  <link rel="stylesheet" href="./css/customers.css">
  <link rel="stylesheet" href="./css/payments.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/search.css">
  <link rel="stylesheet" href="./css/kinder-auth.css">

  <script>
    window.currentTab = 'dashboard';
    window._earlyActionQueue = [];

    function _queueOrRun(realFnName, fallbackRun, ...args) {
      if (typeof window[realFnName] === 'function') {
        return window[realFnName](...args);
      }
      if (typeof fallbackRun === 'function') {
        fallbackRun();
      }
      window._earlyActionQueue.push(() => {
        if (typeof window[realFnName] === 'function') {
          window[realFnName](...args);
        }
      });
    }

    if (!window.switchTab) {
      window.switchTab = function(tabId) {
        window.currentTab = tabId;
        _queueOrRun('_realSwitchTab', null, tabId);
      };
    }

    if (!window.adminSignOut) {
      window.adminSignOut = function() {
        try {
          const key = (window.STORAGE_KEYS && window.STORAGE_KEYS.AUTH_USER) || 'velora_admin_user';
          localStorage.removeItem(key);
        } catch(e) {}
        if (typeof window._realAdminSignOut === 'function') {
          window._realAdminSignOut();
        } else if (typeof window.checkAdminAuthSession === 'function') {
          window.checkAdminAuthSession();
        } else {
          window._earlyActionQueue.push(() => {
            if (typeof window._realAdminSignOut === 'function') {
              window._realAdminSignOut();
            } else if (typeof window.checkAdminAuthSession === 'function') {
              window.checkAdminAuthSession();
            } else {
              window.location.reload();
            }
          });
        }
      };
    }

    if (!window.adminLogin) {
      window.adminLogin = function(...args) {
        _queueOrRun('_realAdminLogin', null, ...args);
      };
    }

    if (!window.showAuthGate) {
      window.showAuthGate = function() {
        if (typeof window._realShowAuthGate === 'function') {
          window._realShowAuthGate();
        } else {
          const el = document.getElementById('adminAuthScreen');
          if (el) el.style.setProperty('display', 'flex', 'important');
          window._earlyActionQueue.push(() => {
            if (typeof window._realShowAuthGate === 'function') window._realShowAuthGate();
          });
        }
      };
    }

    if (!window.closeAuthGate) {
      window.closeAuthGate = function() {
        if (typeof window._realCloseAuthGate === 'function') {
          window._realCloseAuthGate();
        } else {
          const el = document.getElementById('adminAuthScreen');
          if (el) el.style.setProperty('display', 'none', 'important');
          window._earlyActionQueue.push(() => {
            if (typeof window._realCloseAuthGate === 'function') window._realCloseAuthGate();
          });
        }
      };
    }

    if (!window.togglePasswordVisibility) {
      window.togglePasswordVisibility = function() {
        _queueOrRun('_realTogglePasswordVisibility', () => {
          const pwd = document.getElementById('kinderPassword');
          if (pwd) pwd.type = pwd.type === 'password' ? 'text' : 'password';
        });
      };
    }

    if (!window.setKinderAuthMode) {
      window.setKinderAuthMode = function(mode, shouldFocus) {
        _queueOrRun('_realSetKinderAuthMode', null, mode, shouldFocus);
      };
    }

    if (!window.toggleKinderAuthMode) {
      window.toggleKinderAuthMode = function() {
        _queueOrRun('_realToggleKinderAuthMode', null);
      };
    }

    if (!window.fillKinderAccount) {
      window.fillKinderAccount = function(profileKey) {
        _queueOrRun('_realFillKinderAccount', null, profileKey);
      };
    }

    if (!window.handleKinderAuthSubmit) {
      window.handleKinderAuthSubmit = function(e) {
        if (e && typeof e.preventDefault === 'function') e.preventDefault();
        _queueOrRun('_realHandleKinderAuthSubmit', null, e);
      };
    }

    if (!window.closeMobileSidebar) {
      window.closeMobileSidebar = function() {
        const sidebar = document.getElementById('dashboardSidebar');
        if (sidebar) sidebar.classList.remove('mobile-open', 'open');
        const backdrop = document.getElementById('mobileSidebarBackdrop');
        if (backdrop) backdrop.classList.remove('active');
        document.body.classList.remove('sidebar-drawer-active');
      };
    }

    if (!window.toggleMobileSidebar) {
      window.toggleMobileSidebar = function(e) {
        if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
        const sidebar = document.getElementById('dashboardSidebar');
        const backdrop = document.getElementById('mobileSidebarBackdrop');
        if (sidebar) {
          const isOpen = sidebar.classList.toggle('mobile-open');
          sidebar.classList.toggle('open', isOpen);
          if (backdrop) backdrop.classList.toggle('active', isOpen);
          document.body.classList.toggle('sidebar-drawer-active', isOpen);
        }
      };
    }

    if (!window.showToast) {
      window.showToast = function(msg, duration) {
        _queueOrRun('_realShowToast', () => console.log('[Velora Toast]', msg), msg, duration);
      };
    }

    if (!window.openNewProductModal) {
      window.openNewProductModal = function() {
        const m = document.getElementById('newProductModal');
        if (m) m.classList.add('open');
      };
    }
    if (!window.closeNewProductModal) {
      window.closeNewProductModal = function() {
        const m = document.getElementById('newProductModal');
        if (m) m.classList.remove('open');
      };
    }

    if (!window.openNewCustomerModal) {
      window.openNewCustomerModal = function() {
        const m = document.getElementById('newCustomerModal');
        if (m) m.classList.add('open');
      };
    }
    if (!window.closeNewCustomerModal) {
      window.closeNewCustomerModal = function() {
        const m = document.getElementById('newCustomerModal');
        if (m) m.classList.remove('open');
      };
    }

    if (!window.openReceiptModal) {
      window.openReceiptModal = function(orderId) {
        _queueOrRun('_realOpenReceiptModal', null, orderId);
      };
    }
    if (!window.closeReceiptModal) {
      window.closeReceiptModal = function() {
        const m = document.getElementById('receiptModal');
        if (m) m.classList.remove('open');
      };
    }

    if (!window.openOrderDrawer) {
      window.openOrderDrawer = function(orderId) {
        _queueOrRun('_realOpenOrderDrawer', null, orderId);
      };
    }
    if (!window.closeOrderDrawer) {
      window.closeOrderDrawer = function() {
        const d = document.getElementById('orderDrawer');
        if (d) d.classList.remove('open');
      };
    }

    if (!window.openHeaderSearch) {
      window.openHeaderSearch = function() {
        _queueOrRun('_realOpenHeaderSearch', null);
      };
    }
    if (!window.closeHeaderSearch) {
      window.closeHeaderSearch = function() {
        _queueOrRun('_realCloseHeaderSearch', null);
      };
    }

    if (!window.toggleCountryDropdown) {
      window.toggleCountryDropdown = function(force) {
        _queueOrRun('_realToggleCountryDropdown', null, force);
      };
    }
  </script>
</head>

<body>

  <div class="dashboard-viewport">
    <div class="dashboard-shell">

      <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>

      <div id="componentSidebar" data-component="sidebar"></div>

      <main class="dashboard-main">
        <div id="componentHeader" data-component="header"></div>

        <div class="view-container">
          <div id="componentOverview" data-component="overview"></div>
          <div id="componentOrders" data-component="orders"></div>
          <div id="componentReturns" data-component="returns"></div>
          <div id="componentInventory" data-component="inventory"></div>
          <div id="componentCustomers" data-component="customers"></div>
          <div id="componentPayments" data-component="payments"></div>
          <div id="componentNotifications" data-component="notifications"></div>
          <div id="componentSettings" data-component="settings"></div>
        </div>
      </main>

      <div id="componentOrderDrawer" data-component="order-drawer"></div>

    </div>
  </div>

  <div id="componentModals" data-component="modals"></div>

  <div id="componentAuth" data-component="auth"></div>

  <div class="velora-toast-container" id="veloraToastContainer"></div>

  <script src="./js/component-renderer.js"></script>
</body>

</html>
